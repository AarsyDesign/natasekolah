name: Finance Core Verification

on:
  pull_request:
    branches: [staging]
  push:
    branches: [feature/finance-core]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/natasekolah_verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
